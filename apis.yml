name: Chiral Quest
description: 'Chiral Quest (Suzhou) Co., Ltd. (凯瑞斯德生化（苏州）有限公司) is a Chinese pharmaceutical
  CDMO specializing in chiral chemistry. The company operates asymmetric catalytic hydrogenation,
  enzyme-catalyzed biosynthesis, flow chemistry, and process innovation technology platforms, using
  proprietary catalysts to develop and manufacture chiral drug molecules, key raw materials, regulatory
  starting materials (RSMs), and advanced GMP intermediates for global pharmaceutical companies. Founded
  around its asymmetric hydrogenation catalyst technology, Chiral Quest merged with Jiangxi Longlai in
  2012 and with Suzhou Pengxu in 2020; the group employs more than 800 people including a research team
  of roughly 150. Suzhou is the parent company and R&D center, Jiangxi Longlai is the manufacturing base,
  and the company maintains offices in the United Kingdom and the United States. Chiral Quest is a
  brochure-site company with no public API, developer portal, or machine-readable data surface.'
